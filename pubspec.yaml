name: caller_noted
description: "Smart post-call calendar scheduling assistant for professionals."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Calendar & Contacts
  device_calendar: ^4.3.2
  timezone: ^0.9.4
  flutter_contacts: ^1.1.9+2
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Voice & Speech Recognition
  speech_to_text: ^7.0.0
  
  # HTTP & AI Integration
  http: ^1.2.1
  google_generative_ai: ^0.4.6
  
  # Local Storage & Settings
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  
  # UI & Notifications
  flutter_local_notifications: ^17.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
